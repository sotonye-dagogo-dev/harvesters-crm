<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unregister Service Workers</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1B4B3E;
            margin-top: 0;
        }

        .status {
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            font-weight: 500;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        button {
            background: #1B4B3E;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 5px 10px 0;
        }

        button:hover {
            background: #143a2f;
        }

        .instructions {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }

        ul {
            margin: 10px 0;
            padding-left: 20px;
        }

        li {
            margin: 8px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔧 Unregister Service Workers</h1>

        <div class="instructions">
            <strong>Instructions:</strong>
            <ul>
                <li>Click "Unregister All Service Workers" below</li>
                <li>Clear browser cache manually (Ctrl+Shift+Delete)</li>
                <li>Close all tabs for localhost:3000</li>
                <li>Restart the dev server</li>
            </ul>
        </div>

        <button onclick="unregisterServiceWorkers()">Unregister All Service Workers</button>
        <button onclick="clearCacheStorage()">Clear Cache Storage</button>
        <button onclick="location.reload()">Refresh Page</button>

        <div id="status"></div>
    </div>

    <script>
        async function unregisterServiceWorkers() {
            const statusDiv = document.getElementById('status');

            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();

                    if (registrations.length === 0) {
                        statusDiv.innerHTML = '<div class="status info">No service workers found.</div>';
                        return;
                    }

                    let unregistered = 0;
                    for (let registration of registrations) {
                        await registration.unregister();
                        unregistered++;
                    }

                    statusDiv.innerHTML = `<div class="status success">✓ Successfully unregistered ${unregistered} service worker(s)!</div>`;

                    // Wait a bit then offer to reload
                    setTimeout(() => {
                        statusDiv.innerHTML += '<div class="status info">Please clear browser cache (Ctrl+Shift+Delete) and close all tabs.</div>';
                    }, 1000);

                } catch (error) {
                    statusDiv.innerHTML = `<div class="status error">Error: ${error.message}</div>`;
                }
            } else {
                statusDiv.innerHTML = '<div class="status error">Service Workers not supported in this browser.</div>';
            }
        }

        async function clearCacheStorage() {
            const statusDiv = document.getElementById('status');

            if ('caches' in window) {
                try {
                    const cacheNames = await caches.keys();

                    if (cacheNames.length === 0) {
                        statusDiv.innerHTML = '<div class="status info">No caches found.</div>';
                        return;
                    }

                    let deleted = 0;
                    for (let cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        deleted++;
                    }

                    statusDiv.innerHTML = `<div class="status success">✓ Successfully deleted ${deleted} cache(s)!</div>`;

                } catch (error) {
                    statusDiv.innerHTML = `<div class="status error">Error: ${error.message}</div>`;
                }
            } else {
                statusDiv.innerHTML = '<div class="status error">Cache API not supported.</div>';
            }
        }

        // Check status on load
        window.addEventListener('load', async () => {
            const statusDiv = document.getElementById('status');

            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                const cacheNames = await caches.keys();

                let message = `<div class="status info">
                    <strong>Current Status:</strong><br>
                    Service Workers: ${registrations.length}<br>
                    Cache Stores: ${cacheNames.length}
                </div>`;

                statusDiv.innerHTML = message;
            }
        });
    </script>
</body>

</html>
